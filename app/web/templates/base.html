<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1f3a1a">
  <title>{% block title %}Radar de Normas{% endblock %} · HRBio</title>
  <link rel="stylesheet" href="/static/style.css">
  {% block head %}{% endblock %}
</head>
<body>
{% if user %}
<header class="top">
  <h1><a href="/" style="color:inherit;text-decoration:none">HRBio <span>Radar de Normas</span></a></h1>
  <nav style="display:flex;gap:4px"><a class="btn ghost" href="/">Radar</a><a class="btn ghost" href="/calendario">Calendário</a></nav>
  <form method="post" action="/logout">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <button class="btn ghost" type="submit">Sair</button>
  </form>
</header>
{% endif %}
{% block body %}{% endblock %}
{% if user %}<p class="status-line" style="text-align:center;margin:0 0 24px"><a href="/marca">Marca</a> · <a href="/instagram">Instagram</a> · <a href="/conta">Conta</a></p>{% endif %}
<script>
document.addEventListener("click",function(e){var b=e.target.closest("[data-copy]");if(!b)return;
var src=document.getElementById(b.dataset.copy);var t=src.value!==undefined?src.value:src.innerText;
var done=function(){var o=b.textContent;b.textContent="Copiado ✓";setTimeout(function(){b.textContent=o},1500)};
if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(t).then(done)}else{var a=document.createElement("textarea");a.value=t;document.body.appendChild(a);a.select();document.execCommand("copy");a.remove();done()}});
</script>
</body>
</html>
