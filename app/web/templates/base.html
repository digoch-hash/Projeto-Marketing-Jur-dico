<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1f3a1a">
  <title>{% block title %}Radar de Normas{% endblock %} · HRBio</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
{% if user %}
<header class="top">
  <h1><a href="/" style="color:inherit;text-decoration:none">HRBio <span>Radar de Normas</span></a></h1>
  <form method="post" action="/logout">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <button class="btn ghost" type="submit">Sair</button>
  </form>
</header>
{% endif %}
{% block body %}{% endblock %}
</body>
</html>
